<div class="page-title"><div><span class="pill blue">Product analytics</span><h1>Product Performance</h1><p>Analyse par Category → Brand → Product à partir de Dim Product.</p></div><button class="btn primary" (click)="load()">↻ Refresh</button></div>
<app-status-banner *ngIf="errorMessage" type="error" title="API Error" [message]="errorMessage"></app-status-banner>
<div class="controls card"><label><span>Level</span><select [(ngModel)]="level" (change)="load()"><option *ngFor="let item of levels" [value]="item">{{ item }}</option></select></label><label><span>Measure</span><select [(ngModel)]="measure" (change)="load()"><option *ngFor="let item of measures" [value]="item">{{ item }}</option></select></label><label><span>Top</span><input type="number" [(ngModel)]="top" min="1" max="100"></label><button class="btn secondary" (click)="load()">Apply</button></div>
<div class="grid cols-2"><app-chart-panel title="Top products" subtitle="Revenue and quantity by selected level" type="bar" [height]="380" [labels]="labels" [datasets]="datasets" [loading]="loading" reference="Bar chart - Dim Product / Product Hierarchy" annotation="Category → Brand → Product drill path."></app-chart-panel><app-chart-panel title="Product share" subtitle="Revenue share by product segment" type="doughnut" [height]="380" [labels]="labels" [datasets]="shareDatasets" [loading]="loading" reference="Doughnut chart - revenue share" annotation="Shows the share of each selected product segment."></app-chart-panel></div>
<app-data-table title="Product details" subtitle="Aggregated metrics by selected product level" [columns]="columns" [rows]="rows" [loading]="loading"></app-data-table>
