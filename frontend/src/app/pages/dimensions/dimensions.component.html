<div class="page-title"><div><span class="pill yellow">Filter dictionary</span><h1>Dimension Members</h1><p>Récupère les MEMBER_UNIQUE_NAME à utiliser comme filtres dans les endpoints analytiques.</p></div><button class="btn primary" (click)="load()">↻ Refresh</button></div>
<app-status-banner *ngIf="errorMessage" type="error" title="API Error" [message]="errorMessage"></app-status-banner>
<div class="controls card"><label><span>Dimension</span><select [(ngModel)]="dimension" (change)="onDimensionChange()"><option *ngFor="let item of dimensions" [value]="item">{{ item }}</option></select></label><label><span>Level</span><select [(ngModel)]="level" (change)="load()"><option *ngFor="let item of defaultLevels[dimension]" [value]="item">{{ item }}</option></select></label><label><span>Top</span><input type="number" [(ngModel)]="top" min="1" max="500"></label><button class="btn secondary" (click)="load()">Load members</button></div>
<div class="dictionary card"><div><strong>How to use it</strong><p>Copy any MEMBER_UNIQUE_NAME and send it as a query filter, for example <code>countryUniqueName</code>, <code>productCategoryUniqueName</code>, <code>yearUniqueName</code>.</p></div></div>
<app-data-table title="Members" subtitle="Captions and unique names returned by SSAS" [columns]="columns" [rows]="rows" [loading]="loading"></app-data-table>
