<div class="page-title">
  <div>
    <span class="pill blue">Sales analytics</span>
    <h1>Sales Trend & Drill-down</h1>
    <p>Analyse des ventes par temps, produit, client, employé et géographie.</p>
  </div>
  <button class="btn primary" type="button" (click)="loadAll()">↻ Refresh</button>
</div>

<app-status-banner *ngIf="errorMessage" type="error" title="API Error" [message]="errorMessage"></app-status-banner>

<div class="controls card">
  <label><span>Trend grain</span><select [(ngModel)]="grain" (change)="loadTrend()"><option *ngFor="let item of grains" [value]="item">{{ item }}</option></select></label>
  <label><span>Drill axis</span><select [(ngModel)]="axis" (change)="onAxisChange(); loadDrilldown()"><option *ngFor="let item of axes" [value]="item">{{ item }}</option></select></label>
  <label><span>Level</span><select [(ngModel)]="level" (change)="loadDrilldown()"><option *ngFor="let item of levelOptions" [value]="item">{{ item }}</option></select></label>
  <label><span>Measure</span><select [(ngModel)]="measure" (change)="loadDrilldown()"><option *ngFor="let item of measures" [value]="item">{{ item }}</option></select></label>
  <label><span>Top</span><input type="number" [(ngModel)]="top" min="1" max="100" /></label>
  <button class="btn secondary" type="button" (click)="loadDrilldown()">Apply drill</button>
</div>

<div class="grid cols-2">
  <app-chart-panel title="Time-series analysis" subtitle="Sales by selected Dim Date level" type="line" [height]="380" [labels]="trendLabels" [datasets]="trendDatasets" [loading]="loadingTrend" reference="Line chart - Dim Date / HiérarchieDate" annotation="Use Year, Quarter, Month or Date grain for time-series analysis."></app-chart-panel>
  <app-chart-panel title="Drill-down result" subtitle="Dynamic MDX drill-down by selected axis" type="bar" [height]="380" [labels]="drillLabels" [datasets]="drillDatasets" [loading]="loadingDrill" reference="Bar chart - selected hierarchy level" annotation="The level list is restricted to valid cube hierarchies to avoid MDX errors."></app-chart-panel>
</div>

<app-data-table title="Drill-down details" subtitle="Member-level values returned by SSAS" [columns]="columns" [rows]="rows" [loading]="loadingDrill"></app-data-table>
