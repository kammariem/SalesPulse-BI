<div class="page-title"><div><span class="pill blue">Customer analytics</span><h1>Customer Performance</h1><p>Analyse par Category → Customer Type → Company → Customer.</p></div><button class="btn primary" (click)="load()">↻ Refresh</button></div>
<app-status-banner *ngIf="errorMessage" type="error" title="API Error" [message]="errorMessage"></app-status-banner>
<div class="controls card"><label><span>Level</span><select [(ngModel)]="level" (change)="load()"><option *ngFor="let item of levels" [value]="item">{{ item }}</option></select></label><label><span>Measure</span><select [(ngModel)]="measure" (change)="load()"><option *ngFor="let item of measures" [value]="item">{{ item }}</option></select></label><label><span>Top</span><input type="number" [(ngModel)]="top" min="1" max="100"></label><button class="btn secondary" (click)="load()">Apply</button></div>
<div class="grid cols-2"><app-chart-panel title="Customer ranking" subtitle="Revenue and orders by selected customer level" type="bar" [height]="380" [labels]="labels" [datasets]="datasets" [loading]="loading" reference="Bar chart - Dim Customer / Customer Hierarchy" annotation="Category → Customer Type → Company → Customer."></app-chart-panel><app-chart-panel title="Customer share" subtitle="Revenue share by selected segment" type="doughnut" [height]="380" [labels]="labels" [datasets]="shareDatasets" [loading]="loading" reference="Doughnut chart - customer revenue share" annotation="Shows contribution by customer segment."></app-chart-panel></div>
<app-data-table title="Customer details" subtitle="Aggregated metrics by customer level" [columns]="columns" [rows]="rows" [loading]="loading"></app-data-table>
