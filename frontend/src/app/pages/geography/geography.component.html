<div class="page-title"><div><span class="pill blue">Geography analytics</span><h1>Regional Segmentation</h1><p>Analyse des ventes par Country → City.</p></div><button class="btn primary" (click)="load()">↻ Refresh</button></div>
<app-status-banner *ngIf="errorMessage" type="error" title="API Error" [message]="errorMessage"></app-status-banner>
<div class="controls card"><label><span>Level</span><select [(ngModel)]="level" (change)="load()"><option *ngFor="let item of levels" [value]="item">{{ item }}</option></select></label><label><span>Measure</span><select [(ngModel)]="measure" (change)="load()"><option *ngFor="let item of measures" [value]="item">{{ item }}</option></select></label><label><span>Top</span><input type="number" [(ngModel)]="top" min="1" max="100"></label><button class="btn secondary" (click)="load()">Apply</button></div>
<div class="grid cols-2"><app-chart-panel title="Geographic revenue" subtitle="Sales amount by selected geography level" type="bar" [height]="380" [labels]="labels" [datasets]="datasets" [loading]="loading" reference="Bar chart - Dim Geography / Geography Hierarchy" annotation="Country → City drill path."></app-chart-panel><app-chart-panel title="Country / city share" subtitle="Revenue share by location" type="doughnut" [height]="380" [labels]="labels" [datasets]="shareDatasets" [loading]="loading" reference="Doughnut chart - geography revenue share" annotation="Shows country/city contribution."></app-chart-panel></div>
<app-data-table title="Geography details" subtitle="Aggregated metrics by geography level" [columns]="columns" [rows]="rows" [loading]="loading"></app-data-table>
