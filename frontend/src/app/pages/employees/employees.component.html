<div class="page-title"><div><span class="pill blue">Employee analytics</span><h1>Team Performance</h1><p>Analyse par Department → Job Title → Employee.</p></div><button class="btn primary" (click)="load()">↻ Refresh</button></div>
<app-status-banner *ngIf="errorMessage" type="error" title="API Error" [message]="errorMessage"></app-status-banner>
<div class="controls card"><label><span>Level</span><select [(ngModel)]="level" (change)="load()"><option *ngFor="let item of levels" [value]="item">{{ item }}</option></select></label><label><span>Measure</span><select [(ngModel)]="measure" (change)="load()"><option *ngFor="let item of measures" [value]="item">{{ item }}</option></select></label><label><span>Top</span><input type="number" [(ngModel)]="top" min="1" max="100"></label><button class="btn secondary" (click)="load()">Apply</button></div>
<div class="grid cols-2"><app-chart-panel title="Employee ranking" subtitle="Revenue and orders by selected employee level" type="bar" [height]="380" [labels]="labels" [datasets]="datasets" [loading]="loading" reference="Bar chart - Dim Employee / Employee Hierarchy" annotation="Department → Job Title → Employee drill path."></app-chart-panel><app-chart-panel title="Performance share" subtitle="Contribution by team segment" type="doughnut" [height]="380" [labels]="labels" [datasets]="shareDatasets" [loading]="loading" reference="Doughnut chart - employee revenue share" annotation="Shows contribution by team segment."></app-chart-panel></div>
<app-data-table title="Employee details" subtitle="Aggregated metrics by employee level" [columns]="columns" [rows]="rows" [loading]="loading"></app-data-table>
